name: CI

on:
  push:
    branches: [ main ]
    paths: [ "backend_rpi4/**", "requirements.txt", "pytest.ini" ]
  pull_request:
    branches: [ main ]
    paths: [ "backend_rpi4/**", "requirements.txt", "pytest.ini" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest backend_rpi4 -q
